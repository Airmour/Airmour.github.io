baseURL = "https://airmour.github.io/"
title = "Airmour 的博客"
locale = "zh-CN"
defaultContentLanguage = "zh-cn"
hasCJKLanguage = true
enableRobotsTXT = true
enableEmoji = true

[pagination]
pagerSize = 10

[permalinks]
post = "/p/:slug/"

[taxonomies]
category = "categories"
series = "series"
tag = "tags"
author = "authors"

[markup.highlight]
noClasses = false

[markup.goldmark.renderer]
unsafe = true

[[menu.main]]
name = "文章"
weight = 1
url = "/posts/"

[[menu.main]]
name = "关于"
weight = 2
url = "/about/"
